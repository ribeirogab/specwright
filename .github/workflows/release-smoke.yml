name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Package and scaffolder checks
        run: bash tests/install/run.sh

      - name: Handoff-readiness validator
        run: bash tests/validate-change/run.sh

      - name: Skill authoring checks
        run: python3 tests/skills/test_validation.py

      - name: Every skill validates
        run: |
          for skill in plugins/sw/skills/*/; do
            python3 plugins/sw/scripts/quick_validate.py "$skill"
          done

      - name: Every change artifact is handoff-ready
        run: |
          for change in .specwright/changes/*/; do
            [ -f "$change/plan.md" ] || continue
            plugins/sw/scripts/validate-change.sh "$change"
          done

  host-native-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned host CLIs
        run: npm install --global @anthropic-ai/claude-code@2.1.220 @openai/codex@0.146.0-alpha.3.1

      - name: Print host CLI versions
        run: |
          claude --version
          codex --version

      - name: Run native release smoke tests
        env:
          CI_EPHEMERAL_RUNNER: '1'
        run: bash tests/release/run.sh
