name: Release smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-native-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned host CLIs
        run: npm install --global @anthropic-ai/claude-code@2.1.220 @openai/codex@0.146.0-alpha.3.1

      - name: Print host CLI versions
        run: |
          claude --version
          codex --version

      - name: Run native release smoke tests
        env:
          CI_EPHEMERAL_RUNNER: '1'
        run: bash tests/release/run.sh
